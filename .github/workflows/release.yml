name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: arm64
            os_name: macos
            arch: arm64
            archive_ext: tar.gz
            bin_ext: ""
          - os: macos-14
            target: x86_64
            os_name: macos
            arch: x64
            archive_ext: tar.gz
            bin_ext: ""
          - os: ubuntu-22.04
            target: x86_64
            os_name: linux
            arch: x64
            archive_ext: tar.gz
            bin_ext: ""
          - os: ubuntu-22.04
            target: aarch64
            os_name: linux
            arch: arm64
            archive_ext: tar.gz
            bin_ext: ""
          - os: windows-2022
            target: x86_64
            os_name: windows
            arch: x64
            archive_ext: zip
            bin_ext: ".exe"
          - os: windows-2022
            target: aarch64
            os_name: windows
            arch: arm64
            archive_ext: zip
            bin_ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Enable arm64 apt (Linux aarch64)
        if: matrix.os == 'ubuntu-22.04' && matrix.target == 'aarch64'
        run: |
          sudo dpkg --add-architecture arm64
          # Prevent arm64 lookups against amd64-only mirrors.
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo awk '/^Types:/{added=0} {print} /^Components:/{if(!added){print "Architectures: amd64"; added=1}}' /etc/apt/sources.list.d/ubuntu.sources | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
          fi
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update

      - name: Install Linux cross-compiler
        if: matrix.os == 'ubuntu-22.04' && matrix.target == 'aarch64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross zlib1g-dev:arm64

      - name: Configure (macOS)
        if: matrix.os == 'macos-14'
        run: |
          cmake -S . -B build             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target }}

      - name: Configure (Linux aarch64)
        if: matrix.os == 'ubuntu-22.04' && matrix.target == 'aarch64'
        run: |
          cmake -S . -B build             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_SYSTEM_NAME=Linux             -DCMAKE_SYSTEM_PROCESSOR=aarch64             -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc             -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++             -DZLIB_LIBRARY=/usr/lib/aarch64-linux-gnu/libz.so             -DZLIB_INCLUDE_DIR=/usr/aarch64-linux-gnu/include

      - name: Configure (Linux x64)
        if: matrix.os == 'ubuntu-22.04' && matrix.target == 'x86_64'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Install pkg-config (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: choco install -y pkgconfiglite

      - name: Build zlib (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/madler/zlib zlib
          if ("${{ matrix.target }}" -eq "aarch64") {
            cmake -S zlib -B zlib/build -A ARM64 -DCMAKE_BUILD_TYPE=Release
          } else {
            cmake -S zlib -B zlib/build -A x64 -DCMAKE_BUILD_TYPE=Release
          }
          cmake --build zlib/build --config Release
          $lib = Get-ChildItem -Path zlib/build -Recurse -Filter "zlibstatic.lib" | Select-Object -First 1
          if (-not $lib) {
            $lib = Get-ChildItem -Path zlib/build -Recurse -Filter "zlib.lib" | Select-Object -First 1
          }
          if (-not $lib) {
            throw "zlib library not found"
          }
          "ZLIB_LIBRARY=$($lib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZLIB_INCLUDE_DIR=D:/a/ctrmml-cmd/ctrmml-cmd/zlib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Windows)
        if: matrix.os == 'windows-2022' && matrix.target == 'x86_64'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -A x64 -DPKG_CONFIG_EXECUTABLE=C:/ProgramData/chocolatey/bin/pkg-config.exe -DZLIB_LIBRARY=$env:ZLIB_LIBRARY -DZLIB_INCLUDE_DIR=$env:ZLIB_INCLUDE_DIR

      - name: Configure (Windows ARM64)
        if: matrix.os == 'windows-2022' && matrix.target == 'aarch64'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -A ARM64 -DPKG_CONFIG_EXECUTABLE=C:/ProgramData/chocolatey/bin/pkg-config.exe -DZLIB_LIBRARY=$env:ZLIB_LIBRARY -DZLIB_INCLUDE_DIR=$env:ZLIB_INCLUDE_DIR

      - name: Build
        run: cmake --build build --config Release

      - name: Package (unix)
        if: matrix.os != 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="ctrmml-cmd${{ matrix.bin_ext }}"
          SRC="build/${BIN}"
          DEST_DIR="dist"
          mkdir -p "${DEST_DIR}"
          mkdir -p package
          cp "${SRC}" "package/${BIN}"
          tar -czf "${DEST_DIR}/ctrmml-cmd-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.archive_ext }}" -C package "${BIN}"

      - name: Package (windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $bin = "ctrmml-cmd${{ matrix.bin_ext }}"
          $src = "build/Release/${bin}"
          $dest = "dist"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $src $bin
          $zip = "${dest}/ctrmml-cmd-${version}-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.archive_ext }}"
          Compress-Archive -Path $bin -DestinationPath $zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/*

  release:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -maxdepth 3 -print0 | xargs -0 -I{} mv {} release/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
